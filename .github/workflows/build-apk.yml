name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Clean Android Project Files
      run: |
        echo "=== إنشاء وتجهيز المشروع المتكامل كاملاً ==="
        rm -rf app build.gradle* settings.gradle*
        mkdir -p app/src/main/java/com/lockguard/security/receiver
        mkdir -p app/src/main/java/com/lockguard/security/service
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "LockGuard"
        include(":app")
        EOF

        # 2. build.gradle.kts (Root)
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 3. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.lockguard.security"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.lockguard.security"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            lint {
                abortOnError = false
                checkReleaseBuilds = false
            }
        }

        dependencies {
            val cameraxVersion = "1.3.1"
            implementation("androidx.camera:camera-core:$cameraxVersion")
            implementation("androidx.camera:camera-camera2:$cameraxVersion")
            implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.activity:activity-ktx:1.8.2")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.lifecycle:lifecycle-service:2.7.0")
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.lockguard.security">

            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.front" android:required="false" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_idle_lock"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.LockGuard">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@style/Theme.LockGuard">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver
                    android:name=".receiver.IntruderAdminReceiver"
                    android:description="@string/device_admin_description"
                    android:label="@string/device_admin_label"
                    android:permission="android.permission.BIND_DEVICE_ADMIN"
                    android:exported="true">
                    <meta-data
                        android:name="android.app.device_admin"
                        android:resource="@xml/device_admin_receiver" />
                    <intent-filter>
                        <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                        <action android:name="android.app.action.ACTION_PASSWORD_FAILED" />
                        <action android:name="android.app.action.ACTION_PASSWORD_SUCCEEDED" />
                    </intent-filter>
                </receiver>

                <service
                    android:name=".service.CameraCaptureService"
                    android:foregroundServiceType="camera"
                    android:exported="false" />

            </application>
        </manifest>
        EOF

        # 5. res files
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.LockGuard" parent="android:Theme.Material.Light.NoActionBar">
                <item name="android:statusBarColor">#0F172A</item>
                <item name="android:navigationBarColor">#0F172A</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">حارس قفل الشاشة</string>
            <string name="device_admin_label">حارس قفل الشاشة الذكي</string>
            <string name="device_admin_description">صلاحية مراقبة محاولات فتح القفل الخاطئة والتقاط صورة للمتطفل فوراً لحماية خصوصيتك.</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/device_admin_receiver.xml
        <?xml version="1.0" encoding="utf-8"?>
        <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies>
                <watch-login />
            </uses-policies>
        </device-admin>
        EOF

        # 6. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/lockguard/security/MainActivity.kt
        package com.lockguard.security

        import android.app.admin.DevicePolicyManager
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.result.contract.ActivityResultContracts
        import com.lockguard.security.receiver.IntruderAdminReceiver

        class MainActivity : ComponentActivity() {

            private lateinit var devicePolicyManager: DevicePolicyManager
            private lateinit var adminComponent: ComponentName

            private val deviceAdminLauncher = registerForActivityResult(
                ActivityResultContracts.StartActivityForResult()
            ) {
                if (devicePolicyManager.isAdminActive(adminComponent)) {
                    Toast.makeText(this, "تم تفعيل حارس أندرويد بنجاح!", Toast.LENGTH_LONG).show()
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                devicePolicyManager = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                adminComponent = ComponentName(this, IntruderAdminReceiver::class.java)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 80, 50, 50)
                    setBackgroundColor(0xFF0F172A.toInt())
                }

                val title = TextView(this).apply {
                    text = "🛡️ حارس قفل الشاشة (Lock Guard)"
                    textSize = 20f
                    setTextColor(0xFFFFFFFF.toInt())
                    setPadding(0, 0, 0, 30)
                }
                layout.addView(title)

                val desc = TextView(this).apply {
                    text = "التطبيق جاهز لحماية هاتفك. عند إدخال رمز خاطئ، تلتقط الكاميرا الأمامية صورة المتطفل فوراً."
                    textSize = 14f
                    setTextColor(0xFF94A3B8.toInt())
                    setPadding(0, 0, 0, 40)
                }
                layout.addView(desc)

                val adminBtn = Button(this).apply {
                    text = if (devicePolicyManager.isAdminActive(adminComponent)) "مسؤول الجهاز مفعّل ✅" else "تفعيل مسؤول الجهاز (مطلوب)"
                    setBackgroundColor(0xFF14B8A6.toInt())
                    setTextColor(0xFF020617.toInt())
                    setOnClickListener { requestDeviceAdmin() }
                }
                layout.addView(adminBtn)

                val batteryBtn = Button(this).apply {
                    text = "إلغاء قيود البطارية (لتشغيل دائم)"
                    setBackgroundColor(0xFF1E293B.toInt())
                    setTextColor(0xFFF1F5F9.toInt())
                    setOnClickListener { requestIgnoreBatteryOptimization() }
                }
                layout.addView(batteryBtn)

                setContentView(layout)
            }

            private fun requestDeviceAdmin() {
                if (!devicePolicyManager.isAdminActive(adminComponent)) {
                    val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                        putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComponent)
                        putExtra(
                            DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                            "يتطلب تطبيق حارس قفل الشاشة هذه الصلاحية لمعرفة متى يتم إدخال رمز خاطئ والتقاط صورة للمتطفل فوراً."
                        )
                    }
                    deviceAdminLauncher.launch(intent)
                } else {
                    Toast.makeText(this, "الصلاحية مفعلة بالفعل!", Toast.LENGTH_SHORT).show()
                }
            }

            private fun requestIgnoreBatteryOptimization() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    try {
                        val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                            data = Uri.parse("package:$packageName")
                        }
                        startActivity(intent)
                    } catch (e: Exception) {
                        startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                    }
                }
            }
        }
        EOF

        # 7. IntruderAdminReceiver.kt
        cat << 'EOF' > app/src/main/java/com/lockguard/security/receiver/IntruderAdminReceiver.kt
        package com.lockguard.security.receiver

        import android.app.admin.DeviceAdminReceiver
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import android.util.Log
        import com.lockguard.security.service.CameraCaptureService

        class IntruderAdminReceiver : DeviceAdminReceiver() {

            override fun onPasswordFailed(context: Context, intent: Intent) {
                super.onPasswordFailed(context, intent)
                Log.w(TAG, "🚨 تم رصد محاولة إدخال رمز قفل شاشة خاطئ!")

                val prefs = context.getSharedPreferences("lock_guard_prefs", Context.MODE_PRIVATE)
                val failCount = prefs.getInt("fail_count", 0) + 1
                prefs.edit().putInt("fail_count", failCount).apply()

                val maxAllowed = prefs.getInt("threshold", 1)

                if (failCount >= maxAllowed) {
                    val serviceIntent = Intent(context, CameraCaptureService::class.java).apply {
                        putExtra("ATTEMPT_NUMBER", failCount)
                        putExtra("TIMESTAMP", System.currentTimeMillis())
                    }

                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        context.startForegroundService(serviceIntent)
                    } else {
                        context.startService(serviceIntent)
                    }
                }
            }

            override fun onPasswordSucceeded(context: Context, intent: Intent) {
                super.onPasswordSucceeded(context, intent)
                val prefs = context.getSharedPreferences("lock_guard_prefs", Context.MODE_PRIVATE)
                prefs.edit().putInt("fail_count", 0).apply()
            }

            companion object {
                private const val TAG = "LockGuardAdmin"
            }
        }
        EOF

        # 8. CameraCaptureService.kt
        cat << 'EOF' > app/src/main/java/com/lockguard/security/service/CameraCaptureService.kt
        package com.lockguard.security.service

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.PendingIntent
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import android.util.Log
        import androidx.camera.core.CameraSelector
        import androidx.camera.core.ImageCapture
        import androidx.camera.core.ImageCaptureException
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.core.app.NotificationCompat
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.LifecycleService
        import com.lockguard.security.MainActivity
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale
        import java.util.concurrent.ExecutorService
        import java.util.concurrent.Executors

        class CameraCaptureService : LifecycleService() {

            private lateinit var cameraExecutor: ExecutorService
            private var imageCapture: ImageCapture? = null

            override fun onCreate() {
                super.onCreate()
                cameraExecutor = Executors.newSingleThreadExecutor()
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                super.onStartCommand(intent, flags, startId)
                val attempt = intent?.getIntExtra("ATTEMPT_NUMBER", 1) ?: 1
                startAsForeground()
                takeFrontCameraSelfie(attempt)
                return START_NOT_STICKY
            }

            private fun startAsForeground() {
                val channelId = "lockguard_service_channel"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(
                        channelId,
                        "حارس قفل الشاشة",
                        NotificationManager.IMPORTANCE_LOW
                    )
                    val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                    manager.createNotificationChannel(channel)
                }

                val notificationIntent = Intent(this, MainActivity::class.java)
                val pendingIntent = PendingIntent.getActivity(
                    this, 0, notificationIntent,
                    PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                )

                val notification: Notification = NotificationCompat.Builder(this, channelId)
                    .setContentTitle("حارس قفل الشاشة نشط")
                    .setContentText("جاري تأمين هاتفك ورصد أي محاولة اختراق...")
                    .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                    .setContentIntent(pendingIntent)
                    .build()

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                    startForeground(101, notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA)
                } else {
                    startForeground(101, notification)
                }
            }

            private fun takeFrontCameraSelfie(attemptNumber: Int) {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    try {
                        val cameraProvider = cameraProviderFuture.get()
                        imageCapture = ImageCapture.Builder()
                            .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                            .build()

                        val cameraSelector = CameraSelector.DEFAULT_FRONT_CAMERA
                        cameraProvider.unbindAll()
                        cameraProvider.bindToLifecycle(this, cameraSelector, imageCapture)

                        val photosDir = File(filesDir, "intruders").apply { if (!exists()) mkdirs() }
                        val timeStamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())
                        val photoFile = File(photosDir, "INTRUDER_${timeStamp}_att${attemptNumber}.jpg")
                        val outputOptions = ImageCapture.OutputFileOptions.Builder(photoFile).build()

                        imageCapture?.takePicture(
                            outputOptions,
                            ContextCompat.getMainExecutor(this),
                            object : ImageCapture.OnImageSavedCallback {
                                override fun onImageSaved(outputFileResults: ImageCapture.OutputFileResults) {
                                    Log.i(TAG, "📸 تم التقاط وحفظ صورة المتطفل بنجاح في: ${photoFile.absolutePath}")
                                    notifyOwnerIntruderCaptured(photoFile.name)
                                    stopSelf()
                                }

                                override fun onError(exception: ImageCaptureException) {
                                    Log.e(TAG, "فشل التقاط صورة الكاميرا: ${exception.message}", exception)
                                    stopSelf()
                                }
                            }
                        )
                    } catch (exc: Exception) {
                        Log.e(TAG, "تعذر تشغيل الكاميرا الأمامية في الخلفية: ${exc.message}", exc)
                        stopSelf()
                    }
                }, ContextCompat.getMainExecutor(this))
            }

            private fun notifyOwnerIntruderCaptured(filename: String) {
                val channelId = "intruder_alerts_channel"
                val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val alertChannel = NotificationChannel(
                        channelId,
                        "تنبيهات المتطفلين",
                        NotificationManager.IMPORTANCE_HIGH
                    )
                    manager.createNotificationChannel(alertChannel)
                }

                val openIntent = Intent(this, MainActivity::class.java).apply {
                    putExtra("OPEN_GALLERY", true)
                }
                val pendingIntent = PendingIntent.getActivity(
                    this, 1, openIntent,
                    PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                )

                val alertNotif = NotificationCompat.Builder(this, channelId)
                    .setContentTitle("🚨 تنبيه: محاولة فتح قفل فاشلة!")
                    .setContentText("تم التقاط صورة للشخص الذي حاول فتح هاتفك بواسطة الكاميرا الأمامية.")
                    .setSmallIcon(android.R.drawable.ic_lock_lock)
                    .setPriority(NotificationCompat.PRIORITY_HIGH)
                    .setContentIntent(pendingIntent)
                    .setAutoCancel(true)
                    .build()

                manager.notify(202, alertNotif)
            }

            override fun onDestroy() {
                super.onDestroy()
                cameraExecutor.shutdown()
            }

            companion object {
                private const val TAG = "LockGuardCameraService"
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LockGuard-Android-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
