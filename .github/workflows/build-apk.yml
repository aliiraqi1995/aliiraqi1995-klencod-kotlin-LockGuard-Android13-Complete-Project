name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Organize All Files
      run: |
        echo "=== ترتيب الملفات تلقائياً داخل هيكل أندرويد الرسمي ==="
        mkdir -p app/src/main/java/com/lockguard/security/receiver
        mkdir -p app/src/main/java/com/lockguard/security/service
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/lockguard/security/MainActivity.kt
        [ -f "CameraCaptureService.kt" ] && mv CameraCaptureService.kt app/src/main/java/com/lockguard/security/service/CameraCaptureService.kt
        [ -f "IntruderAdminReceiver.kt" ] && mv IntruderAdminReceiver.kt app/src/main/java/com/lockguard/security/receiver/IntruderAdminReceiver.kt
        [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
        [ -f "device_admin_receiver.xml" ] && mv device_admin_receiver.xml app/src/main/res/xml/device_admin_receiver.xml
        [ -f "colors.xml" ] && mv colors.xml app/src/main/res/values/colors.xml
        [ -f "themes.xml" ] && mv themes.xml app/src/main/res/values/themes.xml
        [ -f "strings.xml" ] && mv strings.xml app/src/main/res/values/strings.xml
        [ -f "gradle-wrapper.properties" ] && mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.LockGuard" parent="android:Theme.Material.Light.NoActionBar">
                <item name="android:statusBarColor">#0F172A</item>
                <item name="android:navigationBarColor">#0F172A</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">حارس قفل الشاشة</string>
            <string name="device_admin_label">حارس قفل الشاشة الذكي</string>
            <string name="device_admin_description">صلاحية مراقبة محاولات فتح القفل الخاطئة والتقاط صورة للمتطفل فوراً لحماية خصوصيتك.</string>
        </resources>
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "LockGuard"
        include(":app")
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.lockguard.security"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.lockguard.security"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            lint {
                abortOnError = false
                checkReleaseBuilds = false
            }
        }

        dependencies {
            val cameraxVersion = "1.3.1"
            implementation("androidx.camera:camera-core:$cameraxVersion")
            implementation("androidx.camera:camera-camera2:$cameraxVersion")
            implementation("androidx.camera:camera-lifecycle:$cameraxVersion")

            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.activity:activity-ktx:1.8.2")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.lifecycle:lifecycle-service:2.7.0")
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LockGuard-Android-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
